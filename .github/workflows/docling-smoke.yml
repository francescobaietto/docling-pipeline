name: docling-smoke

# Runs the Docling integration test inside the published image (manual trigger only).
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the synthetic test PDF
        run: python3 -m tests.make_fixture
        
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
        
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Run Docling integration test
        run: |
          docker run --rm -e RUN_DOCLING_TESTS=1 -e HF_HUB_OFFLINE=1 \
            -v "$PWD/tests:/home/app/tests:ro" \
            "$IMAGE" python -m unittest tests.test_docling_integration -v
        
      - name: Show what Docling extracts from the synthetic PDF
        run: |
          docker run --rm -v "$PWD/tests:/home/app/tests:ro" "$IMAGE" python -c "
          from docling_pipeline.converter import DoclingConverter
          r = DoclingConverter().convert('tests/fixtures/sample_table.pdf')
          print(r.markdown)
          for t in r.tables:
              print(t.columns, t.rows)
          "
